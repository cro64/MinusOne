name: MinusOneUITests
options:
  bundleIdPrefix: com.minusone
targets:
  MinusOneUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/MinusOneUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.minusone.uitests
      SWIFT_VERSION: "5.10"
      GENERATE_INFOPLIST_FILE: true
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_IDENTITY: "-"
      CODE_SIGNING_REQUIRED: true
      CODE_SIGNING_ALLOWED: true
schemes:
  MinusOneUITests:
    build:
      targets:
        MinusOneUITests: all
    test:
      targets:
        - MinusOneUITests
